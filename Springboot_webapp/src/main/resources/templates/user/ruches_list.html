<!-- templates/user/ruches_list.html -->
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="'Ruches — ' + ${rucherId}">Ruches</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" th:href="@{/css/user/ruchers.css}"/>
</head>
<body>
<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <span class="logo">🐝</span>
            <span class="brand-name">Ruches</span>
        </div>
        <nav class="menu">
            <a th:href="@{/user/rucher}">Ruchers</a>
            <a th:href="@{|/ruchers/${rucherId}/ruches|}" class="active">Ruches</a>
            <div class="spacer"></div>
            <a th:href="@{/logout}" class="logout">Déconnexion</a>
        </nav>
    </aside>

    <main class="content">

        <div class="breadcrumb">
            <a th:href="@{/user/rucher}">Ruchers</a> /
            <span th:text="${rucherId}">rucher</span>
        </div>

        <header class="topbar">
            <h1 th:text="'Ruches du rucher « ' + ${rucherId} + ' »'">Ruches</h1>
            <a class="btn btn-plus" th:href="@{|/ruchers/${rucherId}/ruches/new|}" title="Ajouter une ruche">+</a>
        </header>

        <!-- Grille de cards (ruches du rucher) -->
        <section class="cards">

            <!-- Si aucune ruche -->
            <div class="card placeholder" th:if="${ruches == null or #lists.isEmpty(ruches)}">
                <div class="card-hex"></div>
                <h3>Aucune ruche</h3>
                <p class="muted">Clique sur + pour en créer une</p>
            </div>

            <!-- Liste des ruches -->
            <a class="card"
               th:each="ruche : ${ruches}"
               th:href="@{|/ruchers/${rucherId}/ruches/${ruche.id}|}"
               th:title="${ruche.id}">
                <div class="card-hex"></div>
                <h3 th:text="${ruche.id}">ruche_X</h3>
                <p class="muted">
                    <span th:text="${ruche.constants != null ? (ruche.constants.temperature + '°C') : '—'}">—</span>
                    ·
                    <span th:text="${ruche.constants != null ? (ruche.constants.humidity + '%') : '—'}">—</span>
                </p>
            </a>

        </section>

        <!-- Honeycomb décor -->
        <svg class="honeycomb tr" viewBox="0 0 960 600" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <polygon id="hex" points="60,0 120,35 120,105 60,140 0,105 0,35" fill="none" stroke="#FFFFFF" stroke-width="2"/>
            </defs>
            <use href="#hex" x="0" y="0"/><use href="#hex" x="120" y="0"/><use href="#hex" x="240" y="0"/>
            <use href="#hex" x="60" y="80"/><use href="#hex" x="180" y="80"/><use href="#hex" x="300" y="80"/>
            <use href="#hex" x="0" y="160"/><use href="#hex" x="120" y="160"/><use href="#hex" x="240" y="160"/>
        </svg>
        <svg class="honeycomb bl" viewBox="0 0 960 600" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <polygon id="hex2" points="60,0 120,35 120,105 60,140 0,105 0,35" fill="none" stroke="#FFFFFF" stroke-width="2"/>
            </defs>
            <use href="#hex2" x="0" y="0"/><use href="#hex2" x="120" y="0"/><use href="#hex2" x="240" y="0"/>
            <use href="#hex2" x="60" y="80"/><use href="#hex2" x="180" y="80"/><use href="#hex2" x="300" y="80"/>
            <use href="#hex2" x="0" y="160"/><use href="#hex2" x="120" y="160"/><use href="#hex2" x="240" y="160"/>
        </svg>

    </main>
</div>
</body>
</html>
