<!-- templates/user/create_ruches.html -->
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Nouvelle ruche</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/user/admin.css(v=${T(java.lang.System).currentTimeMillis()})}" />


</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand"><span class="logo">🐝</span><span class="brand-name">Ruches</span></div>
        <nav class="menu">
            <a th:href="@{/ruchers}">Ruchers</a>
            <div class="spacer"></div>
            <a th:href="@{/logout}" class="logout">Déconnexion</a>
        </nav>
    </aside>

    <main class="content">
        <h1>Nouvelle ruche</h1>

        <form th:action="@{|/ruchers/${rucherId}/ruches|}" method="post" class="panel form-card">
            <!-- Alerte d'erreur si identifiant invalide (ou autre) -->
            <div th:if="${error}" class="alert-error" th:text="${error}">Une erreur est survenue</div>

            <!-- Nom/ID de la ruche -->
            <div class="field">
                <label for="id">Nom (ID) de la ruche</label>
                <input id="id"
                       name="id"
                       type="text"
                       placeholder="Ex : ruche_1"
                       th:value="${ruche.id}"
                       required
                       pattern="[^.#$\[\]/]{1,64}"
                       title="Caractères interdits : . # $ [ ] / ; max 64 caractères" />
                <small class="help">
                    Cet identifiant sera utilisé comme clé Firebase (évite espaces et caractères
                    <code>. # $ [ ] /</code>).
                </small>
            </div>

            <div class="field">
                <label for="address">Adresse</label>
                <input id="address" name="address" type="text" placeholder="Adresse ou coordonnées" th:value="${ruche.address}" />
            </div>

            <div class="field">
                <label for="description">Description</label>
                <input id="description" name="description" type="text" placeholder="Notes" th:value="${ruche.description}" />
            </div>

            <div class="field">
                <label for="notificationsEnabled">Notifications</label>
                <select id="notificationsEnabled" name="notificationsEnabled">
                    <option th:selected="${ruche.notificationsEnabled == true}" value="true">Activées</option>
                    <option th:selected="${ruche.notificationsEnabled == false}" value="false">Désactivées</option>
                </select>
            </div>

            <!-- Constantes (optionnel) -->
            <div class="fieldset">
                <div class="fieldset-title">Constantes</div>

                <div class="field">
                    <label for="constTemp">Seuil température (°C)</label>
                    <input id="constTemp" name="constants.temperature" type="number" step="1"
                           th:value="${ruche.constants != null ? ruche.constants.temperature : 30}" />
                </div>

                <div class="field">
                    <label for="constHum">Seuil humidité (%)</label>
                    <input id="constHum" name="constants.humidity" type="number" step="1"
                           th:value="${ruche.constants != null ? ruche.constants.humidity : 80}" />
                </div>

                <div class="field">
                    <label for="constInterval">Intervalle d’envoi (ms)</label>
                    <input id="constInterval" name="constants.interval" type="number" step="1000"
                           th:value="${ruche.constants != null ? ruche.constants.interval : 60000}" />
                </div>

                <div class="field">
                    <label for="constNotify">Notifier aux seuils</label>
                    <select id="constNotify" name="constants.notify">
                        <option value="true" th:selected="${ruche.constants == null ? true : ruche.constants.notify}">Oui</option>
                        <option value="false" th:selected="${ruche.constants != null && !ruche.constants.notify}">Non</option>
                    </select>
                </div>
            </div>

            <div class="actions">
                <button class="btn" type="submit">Enregistrer</button>
                <a th:href="@{|/ruchers/${rucherId}|}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </main>
</div>

<!-- Nettoyage simple de l'ID avant envoi (trim) -->
<script>
    document.querySelector('form.panel.form-card')?.addEventListener('submit', function () {
        const id = document.getElementById('id');
        if (id) id.value = id.value.trim();
    });
</script>
</body>
</html>
