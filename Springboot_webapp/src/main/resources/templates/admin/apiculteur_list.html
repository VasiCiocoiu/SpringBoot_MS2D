<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Apiculteurs</title>
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">

</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand"><span class="logo">🐝</span><span class="brand-name">Ruches</span></div>
        <nav class="menu">
            <a th:href="@{/user/rucher}">Dashboard</a>
            <a th:href="@{/apiculteurs}" class="active">Apiculteurs</a>
            <div class="spacer"></div>
            <a th:href="@{/logout}" class="logout">Déconnexion</a>
        </nav>
    </aside>

    <main class="content">
        <header class="topbar">
            <h1 style="margin:0">Apiculteurs</h1>
            <a class="btn" th:href="@{/apiculteurs/new}">+ Ajouter</a>
        </header>

        <section class="cards">
            <div class="card" th:each="a : ${apiculteurs}">
                <h3 th:text="${a.nom + ' ' + a.prenom}">Nom Prénom</h3>
                <p class="muted" th:text="${a.email}">email</p>
                <p class="muted" th:text="${a.adresse}">adresse</p>
                <div style="display:flex; gap:.5rem; margin-top:.5rem">
                    <a class="btn" th:href="@{|/apiculteurs/${a.id}|}">Détail</a>
                    <form th:action="@{|/apiculteurs/${a.id}/delete|}" method="post">
                        <button class="btn" style="background:#a33" type="submit">Supprimer</button>
                    </form>
                </div>
            </div>
            <p th:if="${#lists.isEmpty(apiculteurs)}" class="muted">Aucun apiculteur.</p>
        </section>
    </main>
</div>
</body>
</html>
