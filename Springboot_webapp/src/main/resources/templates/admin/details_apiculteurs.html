<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Détail apiculteur</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand"><span class="logo">🐝</span><span class="brand-name">Ruches</span></div>
        <nav class="menu">
            <a th:href="@{/user/rucher}">Dashboard</a>
            <a th:href="@{/apiculteurs}" class="active">Apiculteurs</a>
            <div class="spacer"></div>
            <a th:href="@{/logout}" class="logout">Déconnexion</a>
        </nav>
    </aside>

    <main class="content">
        <h1 th:text="${apiculteur != null ? apiculteur.nom + ' ' + apiculteur.prenom : 'Apiculteur'}">Apiculteur</h1>
        <div class="panel" th:if="${apiculteur != null}">
            <p><strong>Email :</strong> <span th:text="${apiculteur.email}">—</span></p>
            <p><strong>Adresse :</strong> <span th:text="${apiculteur.adresse}">—</span></p>
            <p><strong>Identifiant :</strong> <span th:text="${apiculteur.identifiant}">—</span></p>
            <p><strong>Créé le :</strong>
                <span th:text="${apiculteur.createdAt != null ? #dates.format(apiculteur.createdAt, 'dd/MM/yyyy HH:mm', 'Europe/Paris') : '—'}">—</span>
            </p>
            <p><strong>Modifié le :</strong>
                <span th:text="${apiculteur.modifiedAt != null ? #dates.format(apiculteur.modifiedAt, 'dd/MM/yyyy HH:mm', 'Europe/Paris') : '—'}">—</span>
            </p>
        </div>
    </main>
</div>
</body>
</html>
