name: Flutter CI

on:
  push:
    branches: [ "main", "front" ]
  pull_request:
    branches: [ "main", "front" ]
  workflow_dispatch:  # permet déclenchement manuel

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout du code
      - uses: actions/checkout@v4

      # 2. Installer Flutter (Dart 3.6+ inclus)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.10.6

      # 3. Vérifier les versions Flutter et Dart pour debug
      - name: Check Flutter & Dart version
        run: flutter --version

      # 4. Désactiver la télémétrie Flutter
      - name: Disable Flutter telemetry
        run: flutter --disable-telemetry

      # 5. Installer les dépendances
      - name: Install dependencies
        run: flutter pub get
        working-directory: esp32_monitoring

      # 6. Analyse du code
      - name: Analyze project
        run: flutter analyze
        working-directory: esp32_monitoring

      # 7. Lancer les tests
      - name: Run tests
        run: flutter test
        working-directory: esp32_monitoring
