name: Flutter CI

on:
  push:
    branches: [ "main", "front" ]
  pull_request:
    branches: [ "main", "front" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Installer Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'  # ou la version que tu utilises

      # Installer les dépendances
      - name: Install dependencies
        run: flutter pub get
        working-directory: esp32_monitoring

      # Analyse statique
      - name: Analyze project source
        run: flutter analyze
        working-directory: esp32_monitoring

      # Lancer les tests
      - name: Run tests
        run: flutter test
        working-directory: esp32_monitoring
