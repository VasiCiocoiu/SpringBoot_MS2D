name: Flutter CI/CD

on:
  push:
    branches: [ "main", "front" ]
  pull_request:
    branches: [ "main", "front" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true  # Désactive la télémétrie Flutter

    steps:
      # 1. Checkout du code
      - uses: actions/checkout@v4

      # 2. Installer Flutter 3.35.4 (Dart 3.6+ inclus)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
          cache: false  # force une installation propre

      # 3. Vérifier les versions Flutter & Dart
      - name: Check Flutter & Dart version
        run: flutter --version

      # 4. Installer les dépendances
      - name: Install dependencies
        run: flutter pub get
        working-directory: esp32_monitoring

      # 5. Analyse statique du code
      - name: Analyze project
        run: flutter analyze
        working-directory: esp32_monitoring

      # 6. Lancer les tests
      - name: Run tests
        run: flutter test
        working-directory: esp32_monitoring

      # 7. Build APK release
      - name: Build APK
        run: flutter build apk --release
        working-directory: esp32_monitoring

      # 8. Sauvegarder l’APK comme artefact GitHub
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: esp32_monitoring/build/app/outputs/flutter-apk/app-release.apk
